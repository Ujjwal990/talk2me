<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Talk2Me — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 24px;
    }
    .page { max-width: 580px; margin: 0 auto; }

    .logo {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .subtitle { color: #475569; font-size: 13px; margin-bottom: 32px; }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .field input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.18s;
      font-family: inherit;
    }
    .field input:focus { border-color: #7c3aed; }
    .hint {
      font-size: 11px;
      color: #334155;
      margin-top: 6px;
      line-height: 1.5;
    }
    .hint code { color: #7c3aed; background: #0f172a; padding: 1px 6px; border-radius: 4px; }

    .info-card {
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.25);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #c4b5fd;
      line-height: 1.55;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #7c3aed, #0ea5e9);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.9; }

    .save-confirm {
      display: none;
      text-align: center;
      color: #34d399;
      font-size: 13px;
      margin-top: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo">Talk2Me</div>
    <p class="subtitle">Backend configuration</p>

    <div class="info-card">
      🔒 API keys and AI model are managed by the backend — no setup needed here.
    </div>

    <div class="card">
      <div class="card-title">Backend Server</div>
      <div class="field">
        <label>Backend URL</label>
        <input type="text" id="backendUrl" placeholder="https://talk2me-backend-production-538e.up.railway.app" />
        <p class="hint">
          URL where talk2me-backend is running.<br>
          Default: <code>https://talk2me-backend-production-538e.up.railway.app</code>
        </p>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">Save</button>
    <div class="save-confirm" id="saveConfirm">✓ Settings saved!</div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
