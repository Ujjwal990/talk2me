<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      padding: 18px 16px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 12px;
      color: #475569;
      margin-bottom: 16px;
    }
    .shortcut-box {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .shortcut-box strong { color: #e2e8f0; display: block; margin-bottom: 4px; }
    kbd {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: monospace;
      font-size: 11px;
      color: #e2e8f0;
    }
    .warning {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: #fca5a5;
      margin-bottom: 14px;
      display: none;
    }
    .settings-link {
      display: block;
      text-align: center;
      padding: 9px;
      background: linear-gradient(90deg, #7c3aed, #0ea5e9);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .settings-link:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="logo">Talk2Me</div>
  <div class="tagline">AI chat reply predictor</div>

  <div class="shortcut-box">
    <strong>How to use</strong>
    1. Click into the chat input box<br>
    2. Select the chat messages<br>
    3. Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd>
  </div>

  <a class="settings-link" href="settings.html" target="_blank">⚙ Open Settings</a>

  <script src="popup.js"></script>
</body>
</html>
